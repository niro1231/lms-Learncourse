services:

  postgres:
    image: postgres:17
    container_name: lms-postgres
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lms-network


  backend:
    build:
      context: ./backend
    container_name: lms-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lms
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - lms-network


  frontend:
    build:
      context: ./frontend
    container_name: lms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lms-network


volumes:
  postgres-data:


networks:
  lms-network: